<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Currency Converter | Simple & Real-Time</title>
  <meta name="description" content="Convert currencies in real time. Simple. Fast. Accurate." />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <style>
    :root {
      --primary-color: #3498db;
      --secondary-color: #2980b9;
      --accent-color: #e74c3c;
      --light-color: #ecf0f1;
      --dark-color: #2c3e50;
      --success-color: #2ecc71;
      --error-color: #e74c3c;
      --border-radius: 8px;
      --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f5f7fa;
      color: var(--dark-color);
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }

    .app-header {
      text-align: center;
      margin-bottom: 2rem;
      color: var(--dark-color);
    }

    .app-header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }

    .app-header h1 i {
      color: var(--primary-color);
    }

    .subtitle {
      color: #7f8c8d;
      font-size: 1.1rem;
    }

    .converter-container {
      background-color: white;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    .amount-input {
      margin-bottom: 1.5rem;
    }

    .amount-input label,
    .currency-select label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--dark-color);
    }

    .amount-input input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #ddd;
      border-radius: var(--border-radius);
      font-size: 1rem;
      transition: var(--transition);
    }

    .amount-input input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
    }

    .currency-selectors {
      display: flex;
      align-items: flex-end;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .currency-select {
      flex: 1;
    }

    .currency-select select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: var(--border-radius);
      font-size: 1rem;
      background-color: white;
      cursor: pointer;
      transition: var(--transition);
    }

    .currency-select select:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    .swap-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 0.5rem;
    }

    .swap-btn:hover {
      background-color: var(--secondary-color);
      transform: rotate(180deg);
    }

    .swap-btn:active {
      transform: rotate(180deg) scale(0.95);
    }

    .convert-btn {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .convert-btn:hover {
      background-color: var(--secondary-color);
    }

    .result-section {
      text-align: center;
      padding: 1.5rem;
      background-color: #f8f9fa;
      border-radius: var(--border-radius);
    }

    .result-display {
      margin-bottom: 1rem;
    }

    .result-display span:first-child {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .result-display span:last-child {
      font-size: 1.5rem;
      margin-left: 0.5rem;
      color: var(--dark-color);
    }

    .conversion-rate {
      margin-bottom: 0.5rem;
      color: #7f8c8d;
      font-size: 0.9rem;
    }

    .last-updated {
      color: #95a5a6;
      font-size: 0.8rem;
      font-style: italic;
    }

    .error-message {
      color: var(--error-color);
      text-align: center;
      margin-bottom: 1.5rem;
      font-weight: 500;
      min-height: 1.5rem;
    }

    .app-footer {
      text-align: center;
      color: #7f8c8d;
      font-size: 0.9rem;
    }

    .app-footer p:first-child {
      margin-bottom: 0.5rem;
    }

    .disclaimer {
      font-size: 0.8rem;
      color: #95a5a6;
    }

    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }

      .app-header h1 {
        font-size: 2rem;
      }

      .converter-container {
        padding: 1.5rem;
      }

      .currency-selectors {
        flex-direction: column;
        align-items: stretch;
        gap: 1rem;
      }

      .swap-btn {
        align-self: center;
        margin: 0.5rem 0;
      }
    }

    @media (max-width: 480px) {
      .app-header h1 {
        font-size: 1.75rem;
      }

      .result-display span:first-child {
        font-size: 2rem;
      }

      .result-display span:last-child {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1><i class="fas fa-exchange-alt"></i> Currency Converter</h1>
      <p class="subtitle">Real-time foreign exchange rates</p>
    </header>

    <main class="converter-container">
      <div class="input-section">
        <div class="amount-input">
          <label for="amount">Amount</label>
          <input type="number" id="amount" placeholder="Enter amount" min="0" step="0.01">
        </div>

        <div class="currency-selectors">
          <div class="currency-select">
            <label for="from-currency">From</label>
            <select id="from-currency"></select>
          </div>

          <button id="swap-currencies" class="swap-btn" aria-label="Swap currencies">
            <i class="fas fa-exchange-alt"></i>
          </button>

          <div class="currency-select">
            <label for="to-currency">To</label>
            <select id="to-currency"></select>
          </div>
        </div>

        <button id="convert-btn" class="convert-btn">Convert</button>
      </div>

      <div class="result-section">
        <div class="result-display">
          <span id="result-amount">0.00</span>
          <span id="result-currency">EUR</span>
        </div>
        <div class="conversion-rate">
          <span id="rate-text">1 USD = 0.85 EUR</span>
        </div>
        <div class="last-updated">
          <span id="update-time">Rates updated: --</span>
        </div>
      </div>
    </main>

    <div class="error-message" id="error-message"></div>

    <footer class="app-footer">
      <p>© <span id="current-year"></span> Currency Converter App | Developed by KALYAN</p>
      <p class="disclaimer">Disclaimer: Exchange rates are for informational purposes only and may vary.</p>
    </footer>

    <!-- Kalyan's Signature -->
    <div style="text-align: center; margin-top: 3rem;">
      <hr style="margin: 2rem auto; width: 80%; border: none; border-top: 1px solid #ddd;" />
      <p style="font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; color: #2c3e50;">
        — <span style="color: #e74c3c; font-weight: bold;">Kalyan</span> © 2025 —
      </p>
      <p style="font-size: 0.75rem; color: #7f8c8d;">Simple code. Powerful impact.</p>
    </div>
  </div>

  <script>
    const currencyList = ["USD", "EUR", "GBP", "JPY", "AUD", "CAD", "CHF", "CNY", "INR"];
    const fullNames = {
      USD: "US Dollar", EUR: "Euro", GBP: "British Pound", JPY: "Japanese Yen",
      AUD: "Australian Dollar", CAD: "Canadian Dollar", CHF: "Swiss Franc",
      CNY: "Chinese Yuan", INR: "Indian Rupee"
    };

    const amountInput = document.getElementById('amount');
    const fromCurrencySelect = document.getElementById('from-currency');
    const toCurrencySelect = document.getElementById('to-currency');
    const swapBtn = document.getElementById('swap-currencies');
    const convertBtn = document.getElementById('convert-btn');
    const resultAmount = document.getElementById('result-amount');
    const resultCurrency = document.getElementById('result-currency');
    const rateText = document.getElementById('rate-text');
    const updateTime = document.getElementById('update-time');
    const errorMessage = document.getElementById('error-message');
    const currentYear = document.getElementById('current-year');
    currentYear.textContent = new Date().getFullYear();

    let exchangeRates = {
      USD: 1, EUR: 0.85, GBP: 0.73, JPY: 110.25, AUD: 1.35, CAD: 1.25,
      CHF: 0.92, CNY: 6.45, INR: 74.50, lastUpdated: new Date()
    };

    function populateCurrencyDropdown(selectElement) {
      currencyList.forEach(code => {
        const option = document.createElement('option');
        option.value = code;
        option.textContent = `${code} - ${fullNames[code]}`;
        selectElement.appendChild(option);
      });
    }

    populateCurrencyDropdown(fromCurrencySelect);
    populateCurrencyDropdown(toCurrencySelect);
    fromCurrencySelect.value = "USD";
    toCurrencySelect.value = "EUR";

    convertBtn.addEventListener('click', convertCurrency);
    swapBtn.addEventListener('click', swapCurrencies);
    amountInput.addEventListener('keyup', e => {
      if (e.key === 'Enter') convertCurrency();
    });

    fetchExchangeRates();

    async function fetchExchangeRates() {
      try {
        await new Promise(resolve => setTimeout(resolve, 800));
        const mockResponse = {
          success: true,
          timestamp: Math.floor(Date.now() / 1000),
          base: "USD",
          rates: {
            USD: 1, EUR: 0.92, GBP: 0.79, JPY: 148.35,
            AUD: 1.56, CAD: 1.36, CHF: 0.88, CNY: 7.18, INR: 83.12
          }
        };
        exchangeRates = { ...mockResponse.rates, lastUpdated: new Date(mockResponse.timestamp * 1000) };
        updateRateText();
        updateLastUpdatedTime();
      } catch (error) {
        showError("Failed to fetch rates. Using old data.");
      }
    }

    function convertCurrency() {
      const amount = parseFloat(amountInput.value);
      if (isNaN(amount) || amount <= 0) return showError("Enter a valid amount.");

      clearError();
      const from = fromCurrencySelect.value;
      const to = toCurrencySelect.value;
      const usd = from === "USD" ? amount : amount / exchangeRates[from];
      const converted = to === "USD" ? usd : usd * exchangeRates[to];
      resultAmount.textContent = converted.toFixed(2);
      resultCurrency.textContent = to;
      updateRateText(from, to);
    }

    function swapCurrencies() {
      [fromCurrencySelect.value, toCurrencySelect.value] = [toCurrencySelect.value, fromCurrencySelect.value];
      if (amountInput.value) convertCurrency();
      else updateRateText();
    }

    function updateRateText(from = fromCurrencySelect.value, to = toCurrencySelect.value) {
      const rate = convert(1, from, to);
      rateText.textContent = `1 ${from} = ${rate.toFixed(6)} ${to}`;
    }

    function updateLastUpdatedTime() {
      if (exchangeRates.lastUpdated) {
        updateTime.textContent = `Rates updated: ${exchangeRates.lastUpdated.toLocaleString()}`;
      }
    }

    function convert(amount, from, to) {
      const usd = from === "USD" ? amount : amount / exchangeRates[from];
      return to === "USD" ? usd : usd * exchangeRates[to];
    }

    function showError(msg) {
      errorMessage.textContent = msg;
    }

    function clearError() {
      errorMessage.textContent = "";
    }
  </script>
</body>
</html>
